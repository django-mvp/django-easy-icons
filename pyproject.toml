[tool.hatch.build.targets.wheel]
packages = ["easy_icons"]

# Hatchling's default source distribution is the whole working tree: tests, the
# example project, documentation and CI configuration. Listing what ships keeps
# it to the package, the readme and the licence. Hatchling adds .gitignore
# itself, so that a build from the source distribution leaves out what the
# repository does.
[tool.hatch.build.targets.sdist]
include = ["easy_icons", "README.md", "LICENSE"]

[dependency-groups]
# Shared toolchain bundle from django-mvp/shared, pinned to a release tag in
# [tool.uv.sources] below so every package in this organisation runs one version
# of each tool. The python marker keeps the 3.11 package floor for consumers:
# dev tooling never ships to them.
dev = ["mvp-shared[dev,test]; python_version >= '3.12'"]
# Same marker as the bundle above: docs tooling needs 3.12 but never ships to
# consumers, so it must not drag the package's own 3.11 floor up with it.
docs = ["fairdm-docs[sphinx_book_theme]; python_version >= '3.12'"]

[tool.uv.sources]
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.6.0" }
fairdm-docs = { git = "https://github.com/FAIR-DM/fairdm-docs" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "tests"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "tests.py", "*_tests.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=easy_icons",
    "--cov-report=html",
    "-ra",
]
filterwarnings = [
    "ignore",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.coverage.run]
branch = true
source = ["easy_icons"]

[tool.djlint]
profile = "django"
indent = 2
preserve_leading_space = true
preserve_blank_lines = true
format_attribute_template_tags = true
format_css = true
format_js = true
max_line_length = 120
max_attribute_length = 70
include = "H006,H013,H020,H021,H023,H025,H030,H031"
ignore = "H017"
extension = "html"

[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, hardcoded test passwords, blind-exception asserts, builtin
# shadowing, unused variables, nested-with and raise-in-try — style rules that
# don't pay for themselves in tests (rewriting test control flow for them adds
# risk without value).
"tests/*" = ["S101", "S105", "B017", "A001", "RUF059", "F841", "SIM117", "TRY301"]
# The bundled example project ships a throwaway dev SECRET_KEY by design.
"example/settings.py" = ["S105"]

[tool.mypy]
files = ["easy_icons"]
disallow_untyped_defs = "False"
disallow_any_unimported = "False"
ignore_missing_imports = "True"
no_implicit_optional = "True"
check_untyped_defs = "False"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"
exclude = ["docs/", "migrations/", "tests/settings.py"]
mypy_path = "easy_icons/"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
ignore_missing_model_attributes = "True"

[tool.deptry]
extend_exclude = ["tasks.py", "tests/", "example/", "docs/"]

[tool.deptry.per_rule_ignores]
DEP003 = ["easy_icons"]

[project]
name = "django-easy-icons"
description = "Easy, flexible icons for Django"
license = "MIT"
# Source of truth for the release flow: tag-release cuts v<version> when no
# matching tag exists on a main push touching this file.
version = "0.6.0"
readme = "README.md"
authors = [{ name = "Sam", email = "samuel.scott.jennings@gmail.com" }]
requires-python = '>=3.11,<4.0'
dependencies = ['django']

[project.urls]
homepage = "https://github.com/SamuelJennings/django-easy-icons"
