name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'easy_icons/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  call-docs:
    uses: django-mvp/shared/.github/workflows/docs.yml@v0.6.0
    with:
      uv-sync-args: '--group docs'
    secrets: inherit
